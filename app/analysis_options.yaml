include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Generated files are formatted by build_runner, not by us.
    invalid_annotation_target: ignore
  exclude:
    - "**/*.freezed.dart"
    - "**/*.g.dart"
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # The Barbarian ships immutable models and const widgets everywhere.
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_final_locals
    - avoid_redundant_argument_values
    - unnecessary_parenthesis

    # Correctness.
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - throw_in_finally
    - unawaited_futures
    - use_build_context_synchronously

    # Arabic + RTL is a hard requirement (spec §41), so directional insets and
    # alignment are enforced by the analyser rather than by review.
    - use_named_constants
    - sort_child_properties_last
