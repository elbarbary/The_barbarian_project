# Arabic is the primary audience, but English stays the template locale: it is
# the language the code is written in, so an untranslated key falls back to a
# string a developer can read rather than to a blank.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
