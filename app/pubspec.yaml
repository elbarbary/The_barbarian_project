name: barbarian
description: "ESTHMR — EGX research, market data and community."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  dio: ^5.11.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  # Sign-in providers. Both work fully client-side (no backend): Apple returns a
  # stable user identifier and Google an account id, which is all this app needs
  # to namespace an on-device watchlist. See ios/ for the one-time provider setup.
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  freezed_annotation: ^3.1.0
  go_router: ^17.5.0
  intl: ^0.20.2
  json_annotation: ^4.12.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.14.1
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  # Generates AppLocalizations from lib/l10n/*.arb (spec §41).
  generate: true

  # Asset globs do not recurse, so every fixture subdirectory is listed.
  assets:
    - assets/fixtures/
    - assets/fixtures/companies/
    - assets/fixtures/cash-or-trash/
    - assets/fixtures/news/
    - assets/fixtures/rates/
    - assets/fixtures/disclosures/
    # Flutter's asset globs are not recursive, so each of these has to be
    # named or the archive ships empty and the app looks like it lost the
    # filings it was built to keep.
    - assets/fixtures/disclosures/archive/
    - assets/fixtures/disclosures/documents/
    - assets/fixtures/briefs/
    - assets/fixtures/signals/
    - assets/fixtures/review/
    - assets/fixtures/sectors/
    # One month deep on purpose — `build_calendar.write_filed` mirrors only
    # the current month, because twelve of them is seven megabytes of binary
    # for filings a reader would have to scroll back a year to reach.
    - assets/fixtures/calendar/filed/

  # The website's own faces — Bricolage Grotesque (display) and Space Grotesk
  # (body) — plus IBM Plex Sans Arabic, which covers the Arabic neither of them
  # does. All three are SIL Open Font License 1.1 and their licence texts ship
  # alongside the binaries in assets/fonts/ (spec §40).
  #
  # The two site faces are variable; styles set FontVariation('wght', n) for
  # exact weights rather than relying on Flutter picking a static instance.
  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Variable.ttf
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Light.ttf
          weight: 300
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
