<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crash warning research · ESTHMR</title>
<meta name="description" content="Could an early warning have softened the EGX's worst crashes? One rule tested on every trading day from 2008 to 2026, with its false alarms, the years it lost, and every figure computed from the published data.">
<meta property="og:title" content="Crash warning research · ESTHMR">
<meta property="og:description" content="One early-warning rule tested on the EGX 30 from 2008 to 2026: what it protected, where it lost, and every false alarm.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://esthmr.com/fragility">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./design.css">
<link rel="stylesheet" href="./shell.css">
<!-- The full research below the account; every rule in it stops at .fe-notebook. -->
<link rel="stylesheet" href="./fragility-notebook.css">
<script>
  /* The reader's own choices, before anything paints: the site's theme and
     language, read from the same keys the app writes. */
  try {
    var theme = localStorage.getItem('esthmr:theme');
    document.documentElement.dataset.theme = theme === 'dark' ? 'dark' : 'light';
    if (localStorage.getItem('esthmr:lang') === 'en') {
      document.documentElement.lang = 'en';
      document.documentElement.dir = 'ltr';
    }
  } catch (e) { /* a blocked store costs the preference, not the page */ }
</script>
<style>
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 400 16px/1.6 'IBM Plex Sans', 'IBM Plex Sans Arabic', system-ui, sans-serif;
  }
  :root[lang="ar"] body { font-family: 'IBM Plex Sans Arabic', 'IBM Plex Sans', system-ui, sans-serif; }
  h1, h2, h3 { margin: 0; text-wrap: balance; }
  p { margin: 0; }
  .fo-num { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; white-space: nowrap; unicode-bidi: isolate; }

  /* ── frame ── */
  .fo-top {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; gap: 14px;
    padding-block: 12px; padding-inline: max(20px, calc((100% - 1080px) / 2));
    background: color-mix(in oklab, var(--bg) 88%, transparent);
    backdrop-filter: saturate(1.2) blur(10px);
    border-bottom: 1px solid var(--rule);
  }
  .fo-brand { font: 700 17px/1 'Bricolage Grotesque', 'IBM Plex Sans', sans-serif; letter-spacing: -.02em; color: var(--ink); }
  .fo-top-name { color: var(--faint); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fo-top-links { margin-inline-start: auto; display: flex; align-items: center; gap: 8px; }
  .fo-top-links a { font-size: 14px; color: var(--t2); padding: 6px 8px; border-radius: 8px; }
  .fo-top-links a:hover { color: var(--accent); }
  .fo-lang {
    font: 500 14px/1 'IBM Plex Sans Arabic', 'IBM Plex Sans', sans-serif;
    color: var(--ink); background: var(--surface); border: 1px solid var(--rule);
    border-radius: 999px; padding: 8px 14px; cursor: pointer;
  }
  .fo-lang:hover { border-color: var(--thread); }
  .fo-main { max-width: 1080px; margin: 0 auto; padding-inline: 20px; padding-block: 0 40px; }
  .fo-state { max-width: 1080px; margin: 0 auto; padding: 80px 20px; color: var(--t2); display: grid; gap: 14px; justify-items: start; }
  .fo-state button, .fo-seg { font: inherit; }
  .fo-state button { border: 1px solid var(--rule); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 8px 14px; cursor: pointer; }

  /* ── opening ── */
  .fo-hero { padding-block: 44px 22px; display: grid; gap: 14px; }
  .fo-eyebrow { font: 500 12px/1.4 'IBM Plex Mono', monospace; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
  :root[lang="ar"] .fo-eyebrow { letter-spacing: 0; font-family: 'IBM Plex Sans Arabic', sans-serif; font-weight: 600; font-size: 13.5px; }
  .fo-title { font: 600 clamp(30px, 5.2vw, 52px)/1.06 'Bricolage Grotesque', 'IBM Plex Sans', sans-serif; letter-spacing: -.025em; max-width: 20ch; }
  :root[lang="ar"] .fo-title { font-family: 'IBM Plex Sans Arabic', sans-serif; font-weight: 700; letter-spacing: 0; line-height: 1.3; max-width: 24ch; }
  .fo-lede { font-size: 17.5px; line-height: 1.7; color: var(--t2); max-width: 64ch; }
  .fo-pill { justify-self: start; font-size: 13px; color: var(--t2); background: var(--sunk); border: 1px solid var(--rule); border-radius: 999px; padding: 5px 12px; }

  .fo-figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
  .fo-fig { background: var(--surface); border: 1px solid var(--edgeIn); border-radius: 16px; padding: 18px 20px; display: grid; gap: 6px; align-content: start; }
  .fo-fig-label { font-size: 14px; color: var(--t2); }
  .fo-fig-main { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; }
  .fo-fig-main > .fo-num { color: var(--accent); }
  .fo-fig.is-plain .fo-fig-main .fo-num { color: var(--ink); }
  .fo-fig-second { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 8px; color: var(--t2); }
  .fo-fig-second .fo-num { font-size: 17px; font-weight: 500; color: var(--ink); }
  .fo-fig.is-plain .fo-fig-second .fo-num { color: var(--down); }
  .fo-fig-note { font-size: 14px; color: var(--t2); }
  .fo-money { display: inline-flex; align-items: baseline; gap: .3em; }
  .fo-unit { font-family: 'IBM Plex Sans Arabic', 'IBM Plex Sans', sans-serif; font-size: .62em; font-weight: 600; letter-spacing: 0; }
  .fo-fig-main .fo-money .fo-num, .fo-fig-main > .fo-num { font-size: 32px; font-weight: 600; letter-spacing: -.01em; line-height: 1.15; }
  .fo-fig-main .fo-money { color: var(--accent); }
  .fo-fig-second .fo-money { color: var(--ink); }
  .fo-cell-money { text-align: end; vertical-align: middle; white-space: nowrap; font-size: 15px; }
  .fo-cell-money .fo-unit { font-size: .85em; font-weight: 500; }

  /* ── panels and sections ── */
  .fo-panel { margin-top: 22px; background: var(--surface); border: 1px solid var(--edgeIn); border-radius: var(--radius-island, 20px); padding: 22px 24px; display: grid; gap: 14px; }
  .fo-section { margin-top: 44px; display: grid; gap: 12px; }
  .fo-panel h2, .fo-section h2, .fo-about h2 { font: 600 24px/1.2 'Bricolage Grotesque', 'IBM Plex Sans', sans-serif; letter-spacing: -.015em; }
  :root[lang="ar"] .fo-panel h2, :root[lang="ar"] .fo-section h2, :root[lang="ar"] .fo-about h2 { font-family: 'IBM Plex Sans Arabic', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: 0; }
  .fo-sub { color: var(--t2); font-size: 15px; max-width: 70ch; }
  .fo-foot { color: var(--t2); font-size: 14px; }
  .fo-panel-head { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 14px 20px; }
  .fo-panel-head > div { display: grid; gap: 4px; flex: 1 1 300px; }
  .fo-panel-head > .fo-segment { display: inline-flex; flex: 0 0 auto; }

  /* ── the growth chart ── */
  .fo-segment { display: inline-flex; flex-wrap: nowrap; gap: 3px; background: var(--sunk); border: 1px solid var(--rule2); border-radius: 12px; padding: 3px; }
  .fo-seg { display: grid; gap: 1px; justify-items: center; border: 1px solid transparent; background: transparent; color: var(--t2); border-radius: 9px; padding: 6px 12px; cursor: pointer; font-size: 13.5px; line-height: 1.25; }
  .fo-seg:hover { color: var(--ink); }
  .fo-seg[aria-pressed="true"] { background: var(--surface); color: var(--ink); border-color: var(--rule); }
  .fo-seg-years { font: 500 12.5px/1.2 'IBM Plex Mono', monospace; white-space: nowrap; }
  .fo-seg-name { font-size: 11.5px; color: var(--faint); }
  .fo-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; font-size: 13.5px; color: var(--t2); min-height: 28px; }
  .fo-key { display: inline-flex; align-items: center; gap: 7px; }
  .fo-key-line { display: inline-block; width: 18px; height: 3px; border-radius: 2px; background: currentColor; }
  .fo-key-band { display: inline-block; width: 12px; height: 12px; border-radius: 3px; background: var(--downTint); border: 1px solid color-mix(in oklab, var(--down) 30%, transparent); }
  .fo-c-rule { color: var(--accent); }
  .fo-c-hold { color: var(--faint); }
  .fo-legend .fo-key { color: var(--t2); }
  .fo-legend .fo-key .fo-key-line.fo-c-rule { color: var(--accent); }
  .fo-readout { margin-inline-start: auto; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--t2); }
  .fo-readout b { font-family: 'IBM Plex Mono', monospace; font-weight: 600; }
  .fo-readout-date { color: var(--ink); font-weight: 500; }
  .fo-readout-warn { color: var(--down); }
  .fo-chart-host { min-height: 200px; }
  .fo-chart-wrap { position: relative; }
  .fo-chart-svg { display: block; max-width: 100%; height: auto; touch-action: pan-y; }
  .fo-dd-label { position: absolute; font-size: 12.5px; color: var(--t2); pointer-events: none; }
  .fo-grid { stroke: var(--rule2); stroke-width: 1; }
  .fo-axis { stroke: var(--rule); stroke-width: 1; }
  .fo-tick { fill: var(--faint); font: 400 11px 'IBM Plex Mono', monospace; }
  .fo-warn-band { fill: var(--downTint); }
  .fo-line-rule { fill: none; stroke: var(--accent); stroke-width: 2.25; stroke-linejoin: round; }
  .fo-line-rule.fo-thin { stroke-width: 1.5; }
  .fo-line-hold { fill: none; stroke: var(--faint); stroke-width: 1.5; stroke-linejoin: round; }
  .fo-dd-hold { fill: color-mix(in oklab, var(--faint) 22%, transparent); stroke: none; }
  .fo-end { font: 600 12px 'IBM Plex Mono', monospace; }
  .fo-end-rule { fill: var(--accent); }
  .fo-end-hold { fill: var(--faint); }
  .fo-cursor-line { stroke: var(--thread); stroke-width: 1; stroke-dasharray: 3 3; }
  .fo-dot-rule { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
  .fo-dot-hold { fill: var(--faint); stroke: var(--surface); stroke-width: 2; }
  .fo-period-summary { font-size: 15.5px; color: var(--ink); border-top: 1px solid var(--rule2); padding-top: 14px; max-width: 80ch; }

  /* ── how it works ── */
  .fo-steps { list-style: none; margin: 4px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
  .fo-step { background: var(--surface); border: 1px solid var(--edgeIn); border-radius: 16px; padding: 18px 20px; display: grid; gap: 8px; align-content: start; }
  .fo-step-n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--accTint); color: var(--accent); font: 600 13px/1 'IBM Plex Mono', monospace; }
  .fo-step h3 { font-size: 17px; font-weight: 600; }
  .fo-step p { color: var(--t2); font-size: 15px; }

  /* ── periods ── */
  .fo-periods { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 12px; margin-top: 4px; }
  .fo-period { background: var(--surface); border: 1px solid var(--edgeIn); border-radius: 16px; padding: 18px 20px; display: grid; gap: 10px; align-content: start; }
  .fo-period-years { font: 500 13px/1 'IBM Plex Mono', monospace; color: var(--faint); justify-self: start; }
  .fo-period h3 { font-size: 18px; font-weight: 600; }
  .fo-period-note { color: var(--t2); font-size: 14.5px; }
  .fo-verdict { justify-self: start; font-size: 13px; font-weight: 600; border-radius: 999px; padding: 4px 10px; }
  .fo-verdict.is-better { color: var(--up); background: var(--upTint); }
  .fo-verdict.is-worse { color: var(--down); background: var(--downTint); }
  .fo-pair { display: grid; gap: 6px; }
  .fo-pair-label { font-size: 12.5px; color: var(--faint); }
  .fo-pair-row { display: grid; grid-template-columns: minmax(64px, auto) 1fr 64px; align-items: center; gap: 10px; font-size: 13.5px; }
  .fo-pair-who { color: var(--t2); white-space: nowrap; }
  .fo-pair-row .fo-num { text-align: end; font-size: 13.5px; font-weight: 600; }
  .fo-bar-track { height: 8px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
  .fo-bar { display: block; height: 100%; width: var(--w); border-radius: 99px; background: currentColor; }
  .fo-bar.is-neg { background: repeating-linear-gradient(135deg, currentColor 0 3px, transparent 3px 6px); box-shadow: inset 0 0 0 1px currentColor; }

  /* ── warnings ── */
  .fo-lanes { display: grid; gap: 4px; margin-top: 6px; }
  .fo-lane { display: grid; grid-template-columns: 1fr; gap: 2px; }
  .fo-lanes.is-side .fo-lane { grid-template-columns: 230px 1fr; column-gap: 16px; align-items: center; }
  .fo-lane-label { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; font-size: 14px; }
  .fo-lane-count { font: 600 14px 'IBM Plex Mono', monospace; }
  .fo-lane-note { flex-basis: 100%; font-size: 12.5px; color: var(--faint); }
  .fo-lanes:not(.is-side) .fo-lane-note { flex-basis: auto; }
  .fo-lane-plot { min-width: 0; }
  .fo-lane-svg { display: block; max-width: 100%; height: auto; overflow: visible; }
  .fo-lane-line { stroke: var(--rule2); stroke-width: 1; }
  .fo-lane-axis .fo-lane-label { min-height: 0; }
  .fo-swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: currentColor; flex: none; }
  .fo-k-crash { color: var(--ink); }
  .fo-k-crash.fo-swatch { border-radius: 2px; transform: rotate(45deg) scale(.8); }
  .fo-k-early { color: var(--up); }
  .fo-k-during { color: var(--iris); }
  .fo-k-false { color: var(--down); }
  .fo-k-smaller { color: var(--faint); }
  .fo-k-other { color: var(--thread); }
  .fo-crash-mark { fill: var(--ink); }
  .fo-kind-dot { fill: currentColor; stroke: var(--surface); stroke-width: 1.5; cursor: pointer; }
  .fo-kind-dot:hover, .fo-kind-dot.is-picked { stroke: var(--ink); stroke-width: 2.5; }
  .fo-warn-detail { min-height: 3.2em; display: flex; gap: 10px; align-items: baseline; font-size: 14.5px; color: var(--t2); border-top: 1px solid var(--rule2); padding-top: 12px; }
  .fo-warn-detail .fo-swatch { transform: translateY(1px); }
  .fo-list summary { cursor: pointer; color: var(--accent); font-size: 14.5px; width: max-content; max-width: 100%; }
  .fo-list[open] summary { margin-bottom: 10px; }

  /* ── tables ── */
  .fo-table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .fo-table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
  .fo-table th, .fo-table td { text-align: start; padding: 11px 12px; border-bottom: 1px solid var(--rule2); vertical-align: top; }
  .fo-table thead th { font-size: 13px; font-weight: 500; color: var(--faint); white-space: nowrap; }
  .fo-table td .fo-swatch { margin-inline-end: 7px; }
  .fo-table td.fo-num { text-align: end; }
  .fo-compare { background: var(--surface); border: 1px solid var(--edgeIn); border-radius: 16px; border-collapse: separate; border-spacing: 0; overflow: hidden; }
  .fo-compare tbody tr:last-child > * { border-bottom: 0; }
  .fo-compare th[scope="row"] { font-weight: 400; min-width: 220px; }
  .fo-compare tr.is-this { background: var(--accTint); }
  .fo-sys-name { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-weight: 600; color: var(--ink); }
  .fo-sys-note { display: block; color: var(--t2); font-size: 13.5px; margin-top: 2px; }
  .fo-tag { font-size: 11.5px; font-weight: 600; color: var(--accent); border: 1px solid color-mix(in oklab, var(--accent) 40%, transparent); border-radius: 999px; padding: 1px 8px; }
  .fo-compare td.fo-num { font-size: 15px; vertical-align: middle; }

  /* ── crashes ── */
  .fo-callout { font-size: 15.5px; background: var(--surface); border: 1px solid var(--edgeIn); border-inline-start: 3px solid var(--accent); border-radius: 12px; padding: 12px 16px; }
  .fo-crashes { list-style: none; margin: 4px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 10px; }
  .fo-crash { background: var(--surface); border: 1px solid var(--edgeIn); border-radius: 14px; padding: 14px 16px; display: grid; gap: 10px; }
  .fo-crash.is-worse { border-color: color-mix(in oklab, var(--down) 45%, var(--edgeIn)); }
  .fo-crash-head { display: grid; gap: 2px; }
  .fo-crash-date { font: 500 12.5px/1.3 'IBM Plex Mono', monospace; color: var(--faint); }
  :root[lang="ar"] .fo-crash-date { font-family: 'IBM Plex Sans Arabic', sans-serif; }
  .fo-crash h3 { font-size: 16px; font-weight: 600; }
  .fo-crash-lead { font-size: 13px; color: var(--up); }
  .fo-crash-bars { display: grid; gap: 6px; }

  /* ── limits and sources ── */
  .fo-limits ul { margin: 0; padding-inline-start: 20px; display: grid; gap: 8px; max-width: 76ch; }
  .fo-limits li { color: var(--t2); font-size: 15.5px; }
  .fo-limits li::marker { color: var(--faint); }
  .fo-about { margin-top: 44px; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
  .fo-about > div { background: var(--surface); border: 1px solid var(--edgeIn); border-radius: 16px; padding: 18px 20px; display: grid; gap: 10px; align-content: start; }
  .fo-about h2 { font-size: 19px !important; }
  .fo-links { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .fo-links a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
  .fo-legal { max-width: 1080px; margin: 0 auto; padding: 22px 20px 48px; font-size: 13px; color: var(--faint); border-top: 1px solid var(--rule); }

  /* ── the model's reading ── */
  .fo-reading { scroll-margin-top: 72px; }
  .fo-status { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; border-radius: 999px; padding: 6px 14px; flex: 0 0 auto; }
  .fo-status.is-off { color: var(--up); background: var(--upTint); }
  .fo-status.is-on { color: var(--down); background: var(--downTint); }
  .fo-status-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .fo-gauges { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; }
  .fo-gauge { background: var(--sunk); border: 1px solid var(--rule2); border-radius: 14px; padding: 14px 16px; display: grid; gap: 8px; align-content: start; }
  .fo-gauge-label { font-size: 14px; color: var(--t2); }
  .fo-gauge-value .fo-num { font-size: 30px; font-weight: 600; line-height: 1.1; color: var(--ink); }
  .fo-gauge-note { font-size: 13px; color: var(--faint); }
  .fo-meter { position: relative; display: block; height: 10px; border-radius: 99px; background: var(--rule2); }
  .fo-meter-fill { position: absolute; inset-block: 0; inset-inline-start: 0; width: var(--w); border-radius: 99px; background: var(--accent); }
  .fo-meter.is-on .fo-meter-fill { background: var(--down); }
  .fo-meter-line { position: absolute; inset-block: -4px; inset-inline-start: var(--at); width: 2px; margin-inline-start: -1px; border-radius: 1px; background: var(--down); }
  .fo-minis { display: grid; gap: 6px; }
  .fo-minis .fo-pair-row { grid-template-columns: minmax(56px, auto) 1fr 44px; }
  .fo-places { margin: 0; display: grid; gap: 10px; }
  .fo-places > div { display: grid; gap: 2px; }
  .fo-places dt { font-size: 13px; color: var(--faint); }
  .fo-places dd { margin: 0; font-size: 15px; font-weight: 500; color: var(--ink); }
  .fo-places dd.fo-place-note { font-size: 13px; font-weight: 400; color: var(--faint); }
  .fo-recent { display: grid; gap: 8px; border-top: 1px solid var(--rule2); padding-top: 12px; }
  .fo-recent-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .fo-recent-list li { display: grid; grid-template-columns: minmax(96px, auto) 1fr 44px auto; align-items: center; gap: 10px; font-size: 13.5px; color: var(--t2); }
  .fo-recent-list .fo-num { color: var(--ink); text-align: end; }
  .fo-recent-flag { font-size: 12px; color: var(--down); }
  .fo-reading-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; font-size: 13.5px; color: var(--t2); border-top: 1px solid var(--rule2); padding-top: 12px; }
  .fo-reading-foot a, .fo-jumps a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }

  /* ── the door to the full research ── */
  .fo-research-intro { border-top: 1px solid var(--rule); padding-top: 32px; }
  .fo-jump-label { font-size: 13px; color: var(--faint); margin-top: 4px; }
  .fo-jumps { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 10px; }
  .fo-jumps li { background: var(--surface); border: 1px solid var(--rule); border-radius: 999px; padding: 6px 14px; font-size: 14px; }
  .fo-main-end { padding-block: 0 8px; }

  /* The notebook paints much of itself light inline, so its section keeps the
     light palette in either theme: a sheet of research paper on the page. */
  #research { color-scheme: light; background: var(--bg); border-block: 1px solid var(--rule); scroll-margin-top: 57px; }
  #research [id] { scroll-margin-top: 110px; }
  #research .fe-score-ticker { top: 57px; }
  .fo-research-state { max-width: 1080px; margin: 0 auto; padding: 48px 20px; display: grid; gap: 12px; justify-items: start; color: #455B6E; font: 400 15px/1.6 'IBM Plex Sans', system-ui, sans-serif; }
  .fo-research-state button { font: inherit; border: 1px solid rgba(27,25,23,.10); background: #FAFCFE; color: #192C3C; border-radius: 10px; padding: 8px 14px; cursor: pointer; }

  @media (max-width: 640px) {
    .fo-top { gap: 10px; }
    .fo-top-name { display: none; }
    .fo-hero { padding-block: 28px 16px; }
    .fo-lede { font-size: 16px; }
    .fo-panel { padding: 16px; border-radius: 16px; }
    .fo-fig-main .fo-money .fo-num, .fo-fig-main > .fo-num { font-size: 28px; }
    .fo-segment { overflow-x: auto; }
    .fo-segment { width: 100%; }
    .fo-seg { flex: 1 1 0; padding-inline: 5px; }
    .fo-seg-years { font-size: 11px; }
    .fo-readout { margin-inline-start: 0; flex-basis: 100%; }
    .fo-crashes { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div id="fo-root"><p class="fo-state">…</p></div>
<!-- The research notebook: every model, table and chart from the research
     runs, loaded from fragility-notebook.html. Outside #fo-root, because the
     account re-renders that on every language switch and resize. -->
<section id="research" class="fe-notebook" data-theme="light" dir="ltr" lang="en" aria-label="Full research"></section>
<div id="fo-end"></div>
<script type="module">
  import { mount, t } from './fragility-overview.js';

  const root = document.getElementById('fo-root');
  const research = document.getElementById('research');
  const end = document.getElementById('fo-end');
  const lang = (() => {
    try { return localStorage.getItem('esthmr:lang') === 'en' ? 'en' : 'ar'; } catch { return 'ar'; }
  })();

  // A link into the notebook names an element that does not exist until the
  // notebook has loaded, so the browser's own jump is repeated once it has.
  const settleOnHash = () => {
    const id = decodeURIComponent(location.hash.slice(1));
    const target = id && document.getElementById(id);
    if (target) target.scrollIntoView();
  };

  const state = (text, retry) => {
    const box = document.createElement('div');
    box.className = 'fo-research-state';
    const said = document.createElement('p');
    said.textContent = text;
    box.append(said);
    if (retry) {
      const again = document.createElement('button');
      again.type = 'button';
      again.textContent = t(lang, 'retry');
      again.addEventListener('click', retry);
      box.append(again);
    }
    research.replaceChildren(box);
  };

  async function loadResearch() {
    state(t(lang, 'researchLoading'));
    try {
      const response = await fetch('fragility-notebook.html');
      if (!response.ok) throw new Error(`fragility-notebook.html answered ${response.status}`);
      research.innerHTML = await response.text();
      // Its script finds its elements by id as it runs, so it goes in after them.
      const script = document.createElement('script');
      script.src = 'fragility-notebook.js';
      script.addEventListener('load', settleOnHash);
      script.addEventListener('error', () => state(t(lang, 'researchFailed'), loadResearch));
      document.body.append(script);
    } catch (error) {
      console.error(error);
      state(t(lang, 'researchFailed'), loadResearch);
    }
  }

  const get = (path) => fetch(path).then((response) => {
    if (!response.ok) throw new Error(`${path} answered ${response.status}`);
    return response.json();
  });

  async function load() {
    const waiting = document.createElement('p');
    waiting.className = 'fo-state';
    waiting.textContent = t(lang, 'loading');
    root.replaceChildren(waiting);
    try {
      const [series, episodes, attribution, reading] = await Promise.all([
        get('backtest/world_monitor_simulation_series.json'),
        get('backtest/c_v2_alert_episodes.json'),
        // Only the tax line reads this, and the page stands without it.
        get('backtest/ladder_attribution_matrix.json').catch(() => null),
        // The model run each day on that day's closes. Without it the card
        // shows the research run's last session and says so.
        get('backtest/model_reading.json').catch(() => null),
      ]);
      mount(root, { series, episodes, attribution, reading }, { lang, end });
      settleOnHash();
    } catch (error) {
      console.error(error);
      const box = document.createElement('div');
      box.className = 'fo-state';
      const said = document.createElement('p');
      said.textContent = t(lang, 'failed');
      const again = document.createElement('button');
      again.type = 'button';
      again.textContent = t(lang, 'retry');
      again.addEventListener('click', load);
      box.append(said, again);
      root.replaceChildren(box);
    }
  }

  load();
  loadResearch();
</script>
</body>
</html>
