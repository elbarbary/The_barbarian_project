<body data-signed="no">

<!-- Says plainly what is on screen, because an invented market that does not
     announce itself is a fabricated financial figure. -->
<div id="gate" class="gate">
  <p><strong id="gate-lead"></strong> <span id="gate-body"></span></p>
</div>

<!-- Signing in and who is signed in are the same corner. The button lived in
     the middle of the demo banner and the account strip lived at the bottom of
     the window, so the two halves of one idea sat at opposite ends of the page
     and the one that mattered moved when the banner went away. -->
<div class="account">
  <span id="who" hidden></span>
  <button id="signin" class="gate-cta"></button>
  <button id="signout" hidden></button>
</div>

<div id="app"></div>

<script type="module" src="./main.js"></script>
</body>
