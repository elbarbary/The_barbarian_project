name: Lab — forecast, score, reveal

# Every registered model, asked about every company, after the close.
#
# WHAT THIS IS
# A private research run. It writes forecasts to `data-source/lab/`, which is
# not served to anybody: a predicted return for a named security is precisely
# what an unlicensed publisher may not put on a screen. What eventually
# reaches a reader is the model leaderboard — rank IC, coverage, how each
# model did against the baselines — months later, once the horizons have
# matured and there is something honest to say.
#
# The point of running it nightly from now is that a forecast is only worth
# anything if it was frozen before the outcome existed. Six weeks of that is
# worth more than any backtest, because a backtest is written by somebody who
# already knows what happened.
#
# WHY IT IS ITS OWN WORKFLOW
# `publish-app-data` takes 35 minutes and sits on the critical path of the
# market data a reader is waiting for. This needs none of that, and nothing
# waits for it. It also fails differently: a model that will not load is a
# gap in a research record, not a reason to stop publishing the exchange.

on:
  schedule:
    # AFTER THE CLOSE, using the exchange's own numbers.
    #
    # "After the close" was tried first and failed, then "before the open"
    # was the fix, and both were answers to the wrong question. The real
    # problem was never the hour: it was that the VENDOR does not publish a
    # completed EGX daily bar for hours — a scan at 15:14, forty-four minutes
    # after the 14:30 close, still had the previous session as the newest bar
    # for every company on the exchange.
    #
    # The exchange publishes it itself. Its market-watch had the 14th settled
    # by 15:35 Cairo, with open, high, low, close and volume, and its own
    # market-status endpoint saying "Closed" rather than leaving it to be
    # inferred from a clock that knows nothing about an early close. So the
    # lab takes today's session from the exchange and forecasts from it, and
    # the first horizon is tomorrow — seventeen hours before the market that
    # would settle it opens.
    #
    # 17:00 Cairo in summer, 16:00 in winter: an hour and a half after the
    # settle observed on 14 September. The second is a retry for the day the
    # exchange is slow or this repository's schedules run late, and is a
    # no-op once the session has been forecast.
    - cron: '0 14 * * 0-4'
    - cron: '0 17 * * 0-4'

  push:
    branches: [main]
    paths:
      - 'scripts/lab/**'
      - 'scripts/gemini.py'
      - 'scripts/egx_scan.mjs'
      - 'scripts/egx_history.mjs'
      - '.github/workflows/lab-nightly.yml'

  workflow_dispatch:
    inputs:
      models:
        description: 'baselines, all, or a comma-separated list'
        default: 'all'
      dry_run:
        description: 'load every model and answer, but write nothing'
        type: boolean
        default: false

concurrency:
  # One lab run at a time. Two runs of the same night would produce two
  # forecasts for the same basis session, and "the forecast" would mean
  # whichever finished last.
  group: lab-nightly
  cancel-in-progress: false

permissions:
  contents: write
  # Keyless auth to Google, for the rerank layer. The runner mints a
  # short-lived OIDC token that Google exchanges for a Vertex access token;
  # no service-account key exists to leak.
  id-token: write

jobs:
  forecast:
    runs-on: ubuntu-latest
    # Measured on this runner, not guessed — and the guess was wrong twice.
    # The dry run of 14 September: six baselines under a second between them,
    # kronos 1,595s, chronos2 38s, timesfm25 52s, for 260 companies each.
    # Kronos is 6.1s a company here against 1.2s on the laptop it was timed
    # on, and it is 94% of the models' cost on its own. With the ~6 minute
    # scan and ~3 to install torch from cache that is a 37-minute job.
    # Ninety leaves room for a slow runner and still none for a hang.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Torch is half a gigabyte and the weights are another hundred
      # megabytes. Both are pinned, so both cache: without this the download
      # is most of the run, every night, for bytes that never change.
      - name: Cache the model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/esthmr-lab
          key: lab-weights-kronos-small-901c26c1
          restore-keys: lab-weights-

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: lab-pip-${{ hashFiles('scripts/lab/requirements.txt') }}
          restore-keys: lab-pip-

      - name: Install the models
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r scripts/lab/requirements.txt

      # Not a pip package: the model classes live in the repository, so the
      # source has to be on disk. Pinned to the commit the measured August
      # run used — a foundation model is a moving target, and a record that
      # says "Kronos-small" without saying which one cannot be verified.
      - name: Fetch Kronos
        run: |
          git clone --quiet https://github.com/shiyu-coder/Kronos.git ../kronos-src
          git -C ../kronos-src checkout --quiet 67b630e67f6a18c9e9be918d9b4337c960db1e9a
          echo "ESTHMR_KRONOS_SOURCE=$(cd ../kronos-src && pwd)" >> "$GITHUB_ENV"

      # The same scan `publish-app-data` uses: ~294 scanner rows and ~264
      # companies with 120 completed split-adjusted bars, pulled over a
      # WebSocket. Fetched here rather than shared because two fetches
      # minutes apart are two different markets, and the forecast has to be
      # made from the bars the record says it was made from.
      #
      # Its log says how many listings have no sessions to fetch (~30 that
      # have never traded) and how many histories are MISSING. Missing is the
      # number that matters: a scan taken during the session on 15 Sep came
      # back 53 companies short, and the steps below rebuilt the public
      # record from it. Now the forecast, the scoring and the publish each
      # refuse a scan with any missing history (`panel.missing`) and leave
      # the record as it was; the retry schedule fetches again.
      - name: Fetch the market scan
        run: |
          mkdir -p ../work
          npm install ws --no-save --silent
          node scripts/egx_scan.mjs ../work

      # Only the lab's own tests stand between the schedule and tonight's
      # forecast. A night that is not forecast cannot be forecast later, so a
      # broken screen must not cost one; the workbench's tests check the
      # publication instead, after it is built.
      - name: Test the lab
        id: tests
        run: python3 -m unittest discover -s scripts/lab -p 'test_*.py'

      # `dry_run` proves the models load and answer without entering
      # anything into the record. There is no other way to test a change to
      # them: writing a run to find out whether it works, and writing another
      # once it does, is the "re-run until it looks better" failure the whole
      # record exists to make impossible, and `run.py` refuses it anyway.
      # Not on a push. A forecast belongs to the schedule: a run made when
      # somebody happened to edit a file is a run made at an arbitrary hour,
      # and after the close `run.py` refuses it outright. The test step above
      # is what validates a change; `dry_run` is how the models are exercised.
      - name: Forecast
        if: github.event_name != 'push' && steps.tests.outcome == 'success'
        env:
          ESTHMR_LAB_CACHE: ~/.cache/esthmr-lab
          LAB_MODELS: ${{ inputs.models || 'all' }}
          ESTHMR_LAB_THREADS: '4'
          # The exchange resets a GitHub runner's connection outright, so
          # today's close — the whole reason this can run after the close —
          # comes through the project's own relay. Unset, on a laptop, the
          # code goes direct.
          ESTHMR_RELAY_URL: ${{ secrets.ESTHMR_RELAY_URL }}
          ESTHMR_RELAY_TOKEN: ${{ secrets.ESTHMR_RELAY_TOKEN }}
        run: |
          scan=$(ls -t ../work/daily_scan_*.json | grep -v fused | head -1)
          echo "scan: $scan"
          python3 scripts/lab/run.py "$scan" \
            --models "$LAB_MODELS" \
            ${{ inputs.dry_run == true && ' ' || '--write' }}

      # Vertex is where the Cloud credits live and the only Gemini endpoint
      # that can spend them. Minted HERE, immediately before the one step that
      # asks Gemini anything — not before the scan, where it used to be, with
      # an hour of Kronos between the token and its first use. The credentials
      # file it also writes lets `gemini.py` mint another if a run outlasts it.
      - name: Authenticate to Google Cloud
        id: gcp
        if: always() && github.event_name != 'push' && steps.tests.outcome == 'success'
        uses: google-github-actions/auth@v2
        continue-on-error: true
        with:
          project_id: project-8bba98ed-6d90-45af-ab8
          workload_identity_provider: projects/604618997878/locations/global/workloadIdentityPools/github/providers/repo
          service_account: esthmr-ci@project-8bba98ed-6d90-45af-ab8.iam.gserviceaccount.com
          token_format: access_token
          audience: https://github.com/elbarbary

      # The re-rank reads the night the step above sealed — sixteen readings,
      # one per combination of filings, news, the rule book and measurements —
      # and seals them beside it. `always()` because the retry schedule finds
      # the night already forecast and still has a reading to take if the
      # first attempt at it failed; `rerank.py` refuses any night that is not
      # the session the exchange says has just closed, and a night already
      # read, so there is nothing for it to do twice.
      - name: Re-rank with context
        if: always() && github.event_name != 'push' && steps.tests.outcome == 'success'
        env:
          ESTHMR_RELAY_URL: ${{ secrets.ESTHMR_RELAY_URL }}
          ESTHMR_RELAY_TOKEN: ${{ secrets.ESTHMR_RELAY_TOKEN }}
          GOOGLE_VERTEX_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
          GOOGLE_CLOUD_PROJECT: project-8bba98ed-6d90-45af-ab8
        run: |
          python3 scripts/lab/rerank.py ${{ inputs.dry_run == true && ' ' || '--write' }}

      # Scoring and revealing are independent of today's forecast: they read
      # runs that were frozen weeks ago against bars the market has since
      # printed. So they happen even when the forecast step failed — a model
      # that would not load, or a run refused because it was too late in the
      # day, is no reason to stop marking the record that already exists.
      - name: Score what has matured
        id: score
        if: always() && inputs.dry_run != true
        run: |
          scan=$(ls -t ../work/daily_scan_*.json | grep -v fused | head -1)
          python3 scripts/lab/evaluate.py "$scan"

      # Opens the commitments whose every horizon has run out, publishing the
      # forecasts with the salts that hide them so a stranger can rebuild the
      # Merkle root a timestamping authority signed weeks earlier. Refuses
      # outright if the rebuilt root does not match.
      - name: Open what has matured
        id: reveal
        if: always() && inputs.dry_run != true
        run: |
          scan=$(ls -t ../work/daily_scan_*.json | grep -v fused | head -1)
          python3 scripts/lab/reveal.py "$scan"

      # What a reader sees: each model's five highest-ranked and what they
      # returned (`research/top5.json`, public, names no security), and what
      # every model and every re-rank reading said about every company last
      # night (`lab/`, behind the session gate and the warning on the screen).
      - name: Publish what the models say
        id: publish
        if: always() && inputs.dry_run != true && steps.tests.outcome == 'success' && steps.score.outcome == 'success' && steps.reveal.outcome == 'success'
        # Through the relay for the same reason as the forecast: the session
        # that just closed comes from the exchange, which resets a runner's
        # connection, and without it tonight's close is not on the screen.
        env:
          ESTHMR_RELAY_URL: ${{ secrets.ESTHMR_RELAY_URL }}
          ESTHMR_RELAY_TOKEN: ${{ secrets.ESTHMR_RELAY_TOKEN }}
        run: |
          scan=$(ls -t ../work/daily_scan_*.json | grep -v fused | head -1)
          python3 scripts/lab/publish.py "$scan"

      # Then check the project's own evidence the way a stranger would, from
      # the published files alone: rehash every revealed record, rebuild the
      # tree, compare it with the root in the commitment, and read the
      # timestamp token to confirm it is about THAT root. Fails the job if any
      # of it does not hold — the point of shipping a verifier is that this
      # project finds out first.
      - name: Verify what has been opened
        id: verify
        if: always() && inputs.dry_run != true
        run: python3 scripts/lab/verify.py

      # The documents a reader will be shown, checked as they are about to be
      # committed: one publication ID across all of them, readings that match
      # their index, and the workbench's own tests against the real files.
      - name: Validate the precomputed workbench bundle
        id: snapshot
        if: always() && steps.publish.outcome == 'success'
        run: |
          python3 scripts/lab/snapshot.py
          node --test site-worker/test/ai-cards.test.mjs site-worker/test/ai-explorer.test.mjs

      # Committed because the whole value is that it cannot be edited
      # afterwards. A forecast kept only in a CI artifact expires in ninety
      # days and proves nothing about what was believed in September.
      #
      # So the sealed record is committed on every run, whatever failed, and
      # only the publication waits for the checks above. `push.py` says why,
      # and what happens when somebody else pushed first.
      - name: Commit the run
        if: always() && inputs.dry_run != true
        env:
          PUBLICATION: ${{ (steps.tests.outcome == 'success' && steps.publish.outcome == 'success' && steps.verify.outcome == 'success' && steps.snapshot.outcome == 'success') && 'checked' || 'failed' }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          python3 scripts/lab/push.py --publication "$PUBLICATION"

      - name: Preserve failed-run research for recovery
        if: failure() && inputs.dry_run != true
        uses: actions/upload-artifact@v4
        with:
          name: lab-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: ignore
          path: |
            data-source/lab/
            public/data/v1/research/commitments/
