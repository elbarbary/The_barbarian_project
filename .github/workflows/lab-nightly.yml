name: Lab — forecast, score, reveal

# Every registered model, asked about every company, after the close.
#
# WHAT THIS IS
# A private research run. It writes forecasts to `data-source/lab/`, which is
# not served to anybody: a predicted return for a named security is precisely
# what an unlicensed publisher may not put on a screen. What eventually
# reaches a reader is the model leaderboard — rank IC, coverage, how each
# model did against the baselines — months later, once the horizons have
# matured and there is something honest to say.
#
# The point of running it nightly from now is that a forecast is only worth
# anything if it was frozen before the outcome existed. Six weeks of that is
# worth more than any backtest, because a backtest is written by somebody who
# already knows what happened.
#
# WHY IT IS ITS OWN WORKFLOW
# `publish-app-data` takes 35 minutes and sits on the critical path of the
# market data a reader is waiting for. This needs none of that, and nothing
# waits for it. It also fails differently: a model that will not load is a
# gap in a research record, not a reason to stop publishing the exchange.

on:
  schedule:
    # BEFORE THE OPEN, not after the close.
    #
    # "After the close" was the obvious schedule and it was wrong. The data
    # vendor does not publish a completed EGX daily bar for hours: a scan
    # taken at 15:14 — forty-four minutes after the 14:30 close — still had
    # the PREVIOUS session as the newest bar for every company on the
    # exchange. So a run at 15:00 does not forecast from today's session. It
    # forecasts from yesterday's, which makes its one-session horizon today's
    # close — a price the market fixed before the commitment was timestamped.
    # `run.commitment_timing` refuses such a run outright.
    #
    # In the morning the previous session's bars are reliably published
    # (observed at 06:02 and 08:06 Cairo), the exchange has not opened, and
    # every horizon in the run is still ahead of the market.
    #
    # Two attempts because this repository's scheduled runs have been hours
    # late: both land before the 10:00 open in either season, and the second
    # is a no-op when the first has already forecast the session.
    - cron: '0 2 * * 0-4'   # 05:00 Cairo in summer, 04:00 in winter
    - cron: '0 6 * * 0-4'   # 09:00 Cairo in summer, 08:00 in winter

  push:
    branches: [main]
    paths:
      - 'scripts/lab/**'
      - '.github/workflows/lab-nightly.yml'

  workflow_dispatch:
    inputs:
      models:
        description: 'baselines, all, or a comma-separated list'
        default: 'all'
      dry_run:
        description: 'load every model and answer, but write nothing'
        type: boolean
        default: false

concurrency:
  # One lab run at a time. Two runs of the same night would produce two
  # forecasts for the same basis session, and "the forecast" would mean
  # whichever finished last.
  group: lab-nightly
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  forecast:
    runs-on: ubuntu-latest
    # Measured on this runner, not guessed — and the guess was wrong twice.
    # The dry run of 14 September: six baselines under a second between them,
    # kronos 1,595s, chronos2 38s, timesfm25 52s, for 260 companies each.
    # Kronos is 6.1s a company here against 1.2s on the laptop it was timed
    # on, and it is 94% of the models' cost on its own. With the ~6 minute
    # scan and ~3 to install torch from cache that is a 37-minute job.
    # Ninety leaves room for a slow runner and still none for a hang.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Torch is half a gigabyte and the weights are another hundred
      # megabytes. Both are pinned, so both cache: without this the download
      # is most of the run, every night, for bytes that never change.
      - name: Cache the model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/esthmr-lab
          key: lab-weights-kronos-small-901c26c1
          restore-keys: lab-weights-

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: lab-pip-${{ hashFiles('scripts/lab/requirements.txt') }}
          restore-keys: lab-pip-

      - name: Install the models
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r scripts/lab/requirements.txt

      # Not a pip package: the model classes live in the repository, so the
      # source has to be on disk. Pinned to the commit the measured August
      # run used — a foundation model is a moving target, and a record that
      # says "Kronos-small" without saying which one cannot be verified.
      - name: Fetch Kronos
        run: |
          git clone --quiet https://github.com/shiyu-coder/Kronos.git ../kronos-src
          git -C ../kronos-src checkout --quiet 67b630e67f6a18c9e9be918d9b4337c960db1e9a
          echo "ESTHMR_KRONOS_SOURCE=$(cd ../kronos-src && pwd)" >> "$GITHUB_ENV"

      # The same scan `publish-app-data` uses: 296 scanner rows and ~232
      # companies with 120 completed split-adjusted bars, pulled over a
      # WebSocket. Fetched here rather than shared because two fetches
      # minutes apart are two different markets, and the forecast has to be
      # made from the bars the record says it was made from.
      - name: Fetch the market scan
        run: |
          mkdir -p ../work
          npm install ws --no-save --silent
          node scripts/egx_scan.mjs ../work

      - name: Test the lab
        run: cd scripts/lab && python3 -m unittest test_lab

      # `dry_run` proves the models load and answer without entering
      # anything into the record. There is no other way to test a change to
      # them: writing a run to find out whether it works, and writing another
      # once it does, is the "re-run until it looks better" failure the whole
      # record exists to make impossible, and `run.py` refuses it anyway.
      # Not on a push. A forecast belongs to the schedule: a run made when
      # somebody happened to edit a file is a run made at an arbitrary hour,
      # and after the close `run.py` refuses it outright. The test step above
      # is what validates a change; `dry_run` is how the models are exercised.
      - name: Forecast
        if: github.event_name != 'push'
        env:
          ESTHMR_LAB_CACHE: ~/.cache/esthmr-lab
          ESTHMR_LAB_THREADS: '4'
        run: |
          scan=$(ls -t ../work/daily_scan_*.json | grep -v fused | head -1)
          echo "scan: $scan"
          python3 scripts/lab/run.py "$scan" \
            --models "${{ inputs.models || 'all' }}" \
            ${{ inputs.dry_run == true && '--check' || '' }}

      # Scoring and revealing are independent of today's forecast: they read
      # runs that were frozen weeks ago against bars the market has since
      # printed. So they happen even when the forecast step failed — a model
      # that would not load, or a run refused because it was too late in the
      # day, is no reason to stop marking the record that already exists.
      - name: Score what has matured
        if: always() && inputs.dry_run != true
        run: |
          scan=$(ls -t ../work/daily_scan_*.json | grep -v fused | head -1)
          python3 scripts/lab/evaluate.py "$scan"

      # Opens the commitments whose every horizon has run out, publishing the
      # forecasts with the salts that hide them so a stranger can rebuild the
      # Merkle root a timestamping authority signed weeks earlier. Refuses
      # outright if the rebuilt root does not match.
      - name: Open what has matured
        if: always() && inputs.dry_run != true
        run: |
          scan=$(ls -t ../work/daily_scan_*.json | grep -v fused | head -1)
          python3 scripts/lab/reveal.py "$scan"

      # Then check the project's own evidence the way a stranger would, from
      # the published files alone: rehash every revealed record, rebuild the
      # tree, compare it with the root in the commitment, and read the
      # timestamp token to confirm it is about THAT root. Fails the job if any
      # of it does not hold — the point of shipping a verifier is that this
      # project finds out first.
      - name: Verify what has been opened
        if: always() && inputs.dry_run != true
        run: python3 scripts/lab/verify.py

      # Committed because the whole value is that it cannot be edited
      # afterwards. A forecast kept only in a CI artifact expires in ninety
      # days and proves nothing about what was believed in September.
      - name: Commit the run
        if: always() && inputs.dry_run != true
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data-source/lab public/data/v1/research
          if git diff --cached --quiet; then
            echo 'nothing new — the basis session has not moved'
            exit 0
          fi
          git commit -m 'lab: forecasts, scores and reveals'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
