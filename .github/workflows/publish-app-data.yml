name: Publish app data

# Keeps the app in step with the website.
#
# The app reads static JSON under public/data/v1/. That JSON is *derived* from
# the same files the website renders — the Cash or Trash criteria document, the
# Opportunity Scanner field note, and the EGX daily scan. Whenever one of those
# changes, this rebuilds the JSON and commits it, which moves the manifest's
# `data_version`, which is what tells every installed app its cache is stale.
#
# Without this the site and the app drift apart silently: the website shows a
# new investigation and the app keeps serving the previous one forever.

on:
  push:
    branches: [main]
    # Only what the build actually reads.
    #
    # `public/esthmr/**` and `site-worker/**` were here and feed nothing: no
    # script in `scripts/` reads either path. A change to the site's template
    # or the auth worker triggered a live market scan and twenty-eight
    # builders — thirty-four minutes — to republish data that could not have
    # changed, and took a place in this workflow's queue while doing it, so
    # the next real publish waited behind it. Their tests moved to
    # `check-website.yml`, which is the two seconds those pushes needed.
    paths:
      - 'public/evidence/cash-or-trash/criteria.md'
      - 'public/egx-insights.html'
      - 'public/cash-or-trash.html'
      - 'public/*-investigation.html'
      - 'scripts/**'
      - '.github/workflows/publish-app-data.yml'

  # Twice a trading day now: once before the open, once after the close.
  #
  # It used to ask for four Cairo times — 09:30, 10:30, 12:30, 14:45 — on the
  # reasoning that a reader looking at the app at noon should not be reading
  # yesterday afternoon. That reasoning is still right. This workflow is simply
  # the wrong instrument for it, for two measured reasons.
  #
  # It does not fit. A successful run takes 27-115 minutes (p50 41, p90 75).
  # On 2 September 2026 the seven scheduled runs needed 376.6 minutes of
  # strictly serial work inside a 375-minute cron window — 100.4% of a
  # single-slot concurrency group, before the ten-odd pushes a day that enter
  # the same group. At that load the queue cannot drain, and because
  # `cancel-in-progress: false` keeps exactly ONE run pending, each new arrival
  # cancels the one waiting: 33 of 100 runs were cancelled in the week to
  # 3 September, 32 of them before they ever allocated a runner.
  #
  # And it does not arrive. Since 27 August GitHub has been creating this
  # repository's scheduled runs 3.4 to 7.8 hours after their cron time — a
  # platform-side regression, reproduced on a fully idle repository and on a
  # brand-new one-cron workflow, and acknowledged by GitHub staff. Every one of
  # the four Cairo times was landing after the 14:30 close. Not one scheduled
  # publish reached readers during a trading session in the five days to
  # 3 September; every in-session refresh in that window came from a human
  # pushing code.
  #
  # So the session belongs to `publish-prices.yml`, which rebuilds the one
  # document a price comes out of in about three minutes, in its own
  # concurrency group where it can never queue behind this. What is left here
  # is the slow, cumulative work — the harvests, the filed financials, the
  # briefs — which only needs to be current daily, and which is exactly what
  # this is good at.
  #
  # Two Cairo times, four legs, because GitHub cron is UTC and Cairo is UTC+3
  # in summer and UTC+2 in winter. Both legs fire year-round; the one at the
  # wrong hour is an ordinary run an hour early or late, and the build is a
  # no-op when nothing changed. In summer that reads 09:30/10:30 before the
  # open and 14:45/15:45 after the close; in winter 08:30/09:30 and
  # 13:45/14:45.
  #
  # Four runs at ~54 minutes is 216 minutes in the same 375-minute window —
  # 58% utilisation, with room for the pushes that share the group.
  schedule:
    # 09:30 Cairo — before the 10:00 open, so the morning is current
    - cron: '30 6 * * 0-4'      # summer
    - cron: '30 7 * * 0-4'      # winter
    # 14:45 Cairo — just after the 14:30 close
    - cron: '45 11 * * 0-4'     # summer
    - cron: '45 12 * * 0-4'     # winter

  workflow_dispatch:
    inputs:
      force:
        description: 'Commit even if the output is unchanged'
        type: boolean
        default: false

concurrency:
  group: publish-app-data
  cancel-in-progress: false

# The cumulative side-stores, which have to be committed or the harvests that
# write them restart from scratch on every runner.
#
# `build_all.py` describes these harvests as "resumable: whatever the host
# refuses today is simply first in the queue tomorrow". On a runner tomorrow's
# queue was identical to today's, because the store was thrown away with the
# machine — so `harvest_names_mubasher --limit 12`, `harvest_company_filings
# --limit 5`, `enrich_disclosures --limit 8` and `build_financials_api` spent
# their whole request budget on every run of the day and advanced nothing.
# `translations.py` says its cache "is committed … the file is the review
# surface"; CI had never written a line into it.
#
# market_history.json matters differently and more: build_market_history.py
# loads its append-only store from here, not from the published document, and
# never invents a breadth count for a past session. Every breadth row CI added
# was destroyed by the next run.
env:
  STORES: >-
    data-source/egx-beta
    data-source/prices
    scripts/company_filings_seen.json
    scripts/company_briefs.json
    scripts/company_names_ar.json
    scripts/company_profiles.json
    scripts/financials_filed.json
    scripts/macro_insight.json
    scripts/market_history.json
    scripts/news_images.json
    scripts/pdf_statements_filed.json
    scripts/statements_filed.json
    scripts/stock_info.json
    scripts/review_reads.json
    scripts/translations_en.json
    scripts/insider_bulletin_rows.json
    scripts/currency_notes_read.json
    scripts/sector_reads.json
    scripts/extract_unit_cache.json
    scripts/company_exposure_read.json

permissions:
  contents: write
  # Required for keyless auth to Google: the runner mints a short-lived OIDC
  # token that Google exchanges for a Vertex access token. No service-account
  # key exists to leak, which is also why one could not be created — Google now
  # blocks key creation on new projects by default.
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # A ceiling, because this job holds a concurrency group.
    #
    # On 6 Sep 2026 the exchange stalled SSL handshakes rather than refusing
    # them, and the collectors did what they are told to do: `beta.request`
    # allows five attempts at a 150-second timeout with jittered backoff, then
    # a headless-browser fallback — fifteen to twenty minutes per call, and
    # index constituents makes that call once per index. The run sat on one
    # step for 71 minutes and was heading for GitHub's six-hour default, with
    # `cancel-in-progress: false` holding every later run behind it. One bad
    # spell at the exchange became a blocked pipeline rather than one failed
    # build.
    #
    # Each individual timeout is sensible; what was missing was a ceiling on
    # the whole. 100 minutes: the median run is 41 and the longest that has
    # ever succeeded is 80, so this cannot fail a healthy build, and the
    # staleness guard already handles "the exchange did not answer" correctly.
    timeout-minutes: 100

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # A browser, so the exchange steps can actually run here.
      #
      # EGX is JS-rendered behind a WAF and refuses plain HTTP, so the filings,
      # the filed net-profit figures and the archive harvest all need a real
      # browser. Without one they skip — cleanly, but forever — and the filings
      # in the app only ever move when somebody runs the build by hand.
      #
      # Best-effort on purpose. If the install fails, or the exchange refuses
      # this runner's address, every step that needs it skips and leaves the
      # last good document in place. That is worth an attempt each run; it is
      # not worth failing a build over.
      - name: Install Scrapling
        id: scrapling
        continue-on-error: true
        run: |
          # The bare package has no fetchers — `scrapling.fetchers` fails to
          # import and every EGX step falls back to skipping. The working local
          # install is scrapling 0.4.11 with patchright and playwright beside
          # it, which is what the `fetchers` extra pulls in.
          python3 -m pip install --quiet "scrapling[fetchers]" \
            || python3 -m pip install --quiet "scrapling[all]" \
            || python3 -m pip install --quiet scrapling patchright playwright
          # Then the browser binaries themselves.
          python3 -m scrapling install || scrapling install \
            || python3 -m patchright install --with-deps chromium || true
          # Only claim a browser once one has actually opened. Exporting the
          # path on faith puts a traceback in the middle of the build log where
          # an honest "skipping" line belongs.
          if python3 -c 'from scrapling.fetchers import StealthyFetcher'; then
            echo "SCRAPLING_PYTHON=$(which python3)" >> "$GITHUB_ENV"
          else
            echo 'scrapling fetchers unavailable — the exchange steps will skip'
          fi

      # The market scan, which is the spine of everything below it.
      #
      # `market.json` and all 282 company documents are built from a
      # TradingView snapshot that has, until now, only ever been produced on
      # one laptop and committed by hand — git history has no CI commit
      # touching `market.json`, ever. So prices, volumes and company profiles
      # moved when somebody remembered, and the "three times a trading day"
      # schedule above was rebuilding everything except the part a reader
      # actually looks at.
      #
      # `egx_scan.mjs` is the research monitor's scanner, cut down to what
      # `build_market_api.py` reads and stripped of its five local file
      # dependencies. Its only dependency is `ws`.
      #
      # Best-effort, and deliberately so: the user's own EGX notes record that
      # TradingView blocks direct POSTs from some addresses, and a GitHub
      # egress IP is a different proposition from a laptop in Cairo. If it is
      # refused, no scan is written, `build_market_api.py` finds no newer file
      # and leaves yesterday's prices exactly where they are — labelled with
      # yesterday's date, which is the honest failure.
      # Vertex is where the Cloud credits live, and the only Gemini endpoint
      # that can spend them. Without this the build still runs: gemini.py falls
      # back to the API key, that key's separate prepay balance is empty, and
      # filing typing and translation quietly degrade to rules-only.
      - name: Authenticate to Google Cloud
        id: gcp
        uses: google-github-actions/auth@v2
        continue-on-error: true
        with:
          project_id: project-8bba98ed-6d90-45af-ab8
          workload_identity_provider: projects/604618997878/locations/global/workloadIdentityPools/github/providers/repo
          service_account: esthmr-ci@project-8bba98ed-6d90-45af-ab8.iam.gserviceaccount.com
          token_format: access_token
          audience: https://github.com/elbarbary

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch the market scan
        continue-on-error: true
        run: |
          mkdir -p ../work
          npm install ws --no-save --silent
          node scripts/egx_scan.mjs ../work

      # The directory's ratios folded again over the committed review sheet,
      # before the tests hold one to the other.
      #
      # The tests read the tree as the LAST build committed it, and only this
      # job's rebuild writes either document. So when a push race committed
      # the pair split (142b708, 15 Sep 2026: UNIP's price-to-book 2.8315 on
      # its directory row, 2.824 on its review sheet), every later run failed
      # here, before the one step that re-folds them. Runs 34955982717 and
      # 34957349579 both did, and nothing short of a person could have
      # repaired it.
      #
      # The fold is a copy over committed documents, no network and no
      # derived figure. It writes this runner's checkout, which reaches main
      # only through the Commit step, after the rebuild has run the same fold
      # again. The test is exactly as strict: a fold that disagrees with its
      # own documents still fails it. What it stops failing on is an earlier
      # commit's accident. The Commit step re-folds after a race and audits
      # before it pushes, so this should find nothing to do.
      - name: Fold the directory's ratios before testing them
        run: |
          python3 scripts/apply_company_ratios.py
          if ! git diff --quiet -- public/data/v1/companies.json; then
            echo "::warning title=Directory ratios re-folded::The committed directory disagreed with its review documents. Folded again before the tests; the rebuild publishes the repair."
          fi

      # The measures table re-derived from the committed documents, before
      # the tests hold it to them, for the same reason as the fold above.
      #
      # On 15 Sep 2026 the table on main carried NBCC, a listing with no
      # sessions yet, with a close and no date, and runs 34971269319 and
      # 34990199243 failed on it without reaching the rebuild. The table can
      # also fall behind with nobody's bug: publish-prices added NBCC to
      # market.json at 12:02 (8f75a66b0), and run 34966943749 failed its
      # cardinality test four minutes later against a table built before the
      # listing reached main. It recovered only because a run already in
      # flight committed a newer table. With none in flight, every run after
      # it would have failed the same way.
      #
      # About a second, no network. It writes this runner's checkout, and the
      # rebuild writes the table again. A builder that leaves a row undated
      # or cuts the market still fails the tests; what they stop failing on
      # is a table an earlier commit left behind.
      - name: Rebuild the measures table before testing it
        run: python3 scripts/build_measures.py

      # The parsers these tests cover read filed financial figures. A silent
      # regression there publishes a wrong number about a real company rather
      # than crashing, so they run before anything is written, and a failure
      # in the code still stops the job here rather than after a forty-minute
      # rebuild that would end at the same failure.
      #
      # What no longer stops it is a document. Many of these tests read what
      # the LAST commit left under public/data, and only the rebuild below
      # replaces it, so a document that failed them failed every run before
      # the one step that could repair it: UNIP's split ratios (34955982717,
      # 34957349579, 34961265035), NBCC missing from the measures table after
      # the price job listed it (34966943749), then its undated row
      # (34971269319, 34990199243). Sixteen of the 21 runs that failed here
      # from 6 to 15 Sep 2026 failed on a document, and not one of them could
      # reach the step that rewrites it. The folds above are two of those
      # repairs made early; this is the general one.
      #
      # `tests_before_rebuild.py` runs the whole suite and watches what each
      # test reads. A failure whose test touched nothing the rebuild writes is
      # the code's, and stops the job. One that read a document the rebuild
      # rewrites, or started a process whose reads it cannot see, is named
      # and left to "Test what is about to be published", which runs every
      # test again over the rebuilt tree and fails on anything. Nothing is
      # committed on this step's word.
      - name: Test the parsers
        run: python3 scripts/tests_before_rebuild.py -v

      - name: Validate before writing anything
        env:
          GOOGLE_VERTEX_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
          GOOGLE_CLOUD_PROJECT: project-8bba98ed-6d90-45af-ab8
          # Investing.com refuses this runner's address and answers a laptop's,
          # and the exchange resets the connection outright. These route both
          # through the project's own relay (worker/fetchrelay), which fetches
          # three declared hosts and nothing else. Unset — on a laptop — the
          # code goes direct.
          #
          # The exchange half is newer and is what takes the last scheduled
          # laptop off the critical path: "New filings: the host would not
          # answer" in every build, with the archive fed by one Mac at 09:00.
          ESTHMR_RELAY_URL: ${{ secrets.ESTHMR_RELAY_URL }}
          ESTHMR_RELAY_TOKEN: ${{ secrets.ESTHMR_RELAY_TOKEN }}
        run: python3 scripts/build_all.py --check

      - name: Rebuild published data
        env:
          GOOGLE_VERTEX_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
          GOOGLE_CLOUD_PROJECT: project-8bba98ed-6d90-45af-ab8
          # Investing.com refuses this runner's address and answers a laptop's,
          # and the exchange resets the connection outright. These route both
          # through the project's own relay (worker/fetchrelay), which fetches
          # three declared hosts and nothing else. Unset — on a laptop — the
          # code goes direct.
          #
          # The exchange half is newer and is what takes the last scheduled
          # laptop off the critical path: "New filings: the host would not
          # answer" in every build, with the archive fed by one Mac at 09:00.
          ESTHMR_RELAY_URL: ${{ secrets.ESTHMR_RELAY_URL }}
          ESTHMR_RELAY_TOKEN: ${{ secrets.ESTHMR_RELAY_TOKEN }}
        # build_all distinguishes two failures, and so does this.
        #
        #   2  a critical step called the inputs unfit. Everything built before
        #      it came from those inputs, so nothing here should be published:
        #      fail now, and the Commit step never runs.
        #
        #   1  a source would not answer. That step left its published document
        #      alone and every other step produced correct output. Carry on to
        #      Commit and Deploy so that work reaches readers, then fail the run
        #      at the end so nobody mistakes it for a clean build.
        #
        # This is the fix for 3 Sep 2026, when a truncated read from
        # investing.com discarded 107 minutes of finished work — 25 steps'
        # output thrown away because the 26th could not reach its host.
        id: rebuild
        run: |
          set +e
          python3 scripts/build_all.py
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -le 1 ]; then
            if [ "$code" -eq 1 ]; then
              echo "::warning::A source did not refresh. Publishing what succeeded; this run will be marked failed at the end."
            fi
            exit 0
          fi
          exit "$code"

      # The gate: every test, over the documents about to be committed.
      #
      # "Test the parsers" ran before the rebuild, so every test that holds
      # one document to another read the previous run's pair. That is how a
      # bad document went out through a green gate: NBCC's undated measures
      # row was committed at 12:15 UTC on 15 Sep 2026 (2b0685d38) by run
      # 34965020875, whose tests had passed at 11:47, before the rebuild
      # wrote the table.
      #
      # So the suite runs again here, whole and strict, and before "Show what
      # changed", so a failure commits nothing and main keeps what it has. It
      # also decides everything the step before the rebuild left to it.
      #
      # What it cannot see is the Commit step's pull, which can still mix
      # this build with another job's commit. `rederive_and_audit` guards
      # that tree, and whatever the mix leaves no longer blocks the next run,
      # which rebuilds it. Self-repair re-runs the suite over main, not over
      # this runner's rebuilt tree, so a failure only this step can see comes
      # back from it as "nothing to repair": read this log instead.
      - name: Test what is about to be published
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      # The website draws the same figures the parsers produce, and had no
      # tests at all until it was found publishing the design canvas's invented
      # EGX 30 level to signed-in readers. Same reasoning as above: a wrong
      # number renders fine.
      #
      # After the rebuild, for the gate's reason: these tests read
      # measures.json, connections.json, flow-trackers.json and the ownership
      # documents off disk, and before the rebuild those are the previous
      # run's. A change to the site's own code is tested within a minute of
      # its push by check-website.yml, and this job does not run on those
      # paths at all.
      - name: Test the website against it
        run: node --test site-worker/test/*.test.mjs

      - name: Show what changed
        id: diff
        run: |
          git add -A public/data app/assets/fixtures ${STORES}
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No change to published data."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat
          fi

      - name: Confirm the manifest fingerprint moved
        if: steps.diff.outputs.changed == 'true'
        run: |
          # If the content changed but data_version did not, installed apps
          # would never drop their cache — the failure this whole workflow
          # exists to prevent. Fail loudly rather than publish a silent no-op.
          # The manifest is byte-stable when the fingerprint has not moved
          # (build_fixtures.py keeps the previous generated_at), so its presence
          # in the diff is real evidence that data_version changed rather than
          # just evidence that the clock did.
          before=$(git show HEAD:public/data/v1/manifest.json 2>/dev/null \
                   | python3 -c 'import json,sys; print(json.load(sys.stdin)["data_version"])' 2>/dev/null || echo none)
          after=$(python3 -c 'import json; print(json.load(open("public/data/v1/manifest.json"))["data_version"])')
          echo "data_version: $before -> $after"
          if [ "$before" = "$after" ]; then
            echo "::error::Published data changed but data_version did not move."
            echo "::error::Installed apps compare that string to decide whether"
            echo "::error::their cache is stale, so every device would keep"
            echo "::error::serving what it already had. Check that the changed"
            echo "::error::files are covered by RESOURCES or UNVERSIONED in"
            echo "::error::scripts/build_fixtures.py."
            exit 1
          fi

          changed=$(git diff --cached --name-only)
          if ! grep -q 'public/data/v1/manifest.json' <<<"$changed"; then
            echo "::error::Published data changed but public/data/v1/manifest.json did not."
            echo "::error::That file is what an installed app asks for to find out"
            echo "::error::whether its cache is stale. Without it moving, devices"
            echo "::error::keep serving whatever they downloaded last."
            exit 1
          fi
          if ! grep -q 'app/assets/fixtures/manifest.json' <<<"$changed"; then
            echo "::error::The published manifest moved but the bundled one did not."
            echo "::error::A build shipped now would open on data older than it claims."
            exit 1
          fi
          echo "manifest fingerprint moved with the content, both copies"

      - name: Commit
        if: steps.diff.outputs.changed == 'true' || inputs.force
        run: |
          git config user.name  'barbarian-bot'
          git config user.email 'noreply@thebarbarianproject.com'
          git commit -m 'data: rebuild published app data' \
                     -m 'Generated by .github/workflows/publish-app-data.yml'
          # This races the 15-minute job and the price job, four times a day.
          # These outputs are generated, and this job just generated them from
          # the current sources — so on a collision with the fifteen-minute
          # job, ours is the newer answer and wins. A conflict anywhere else
          # is not something to resolve automatically, so it stops.
          #
          # The previous version pulled, hit a conflict, left the rebase in
          # progress, and then failed every retry with "unmerged files" — a
          # loop that could only ever fail three times.
          resolve_ours () {
            local unmerged
            unmerged=$(git diff --name-only --diff-filter=U)
            [ -z "$unmerged" ] && return 0
            if echo "$unmerged" | grep -qv -e '^public/data/' -e '^app/assets/fixtures/' -e '^scripts/.*\.json$' -e '^data-source/prices/' -e '^data-source/egx-beta/'; then
              echo "conflict outside generated data:"; echo "$unmerged"
              git rebase --abort || true
              return 1
            fi
            # During a rebase "theirs" is the commit being replayed — this
            # job's output — and "ours" is what is already on main.
            #
            # Taking theirs unconditionally means the job that pushes LAST
            # wins, and this one runs for about an hour, so on 6 Sep 2026 it
            # published a sixteen-minute-old snapshot over the fifteen-minute
            # lane's fresher one: news went backward twelve minutes, the newest
            # story was un-published, and three of that morning's filings were
            # deleted while the exchange was still listing them. The documents
            # know which of them is newer; the jobs do not. So they are asked.
            # Anything the resolver has no opinion about keeps the old rule.
            echo "$unmerged" | while read -r f; do
              side=none
              tmp=$(mktemp -d)
              if git show ":2:$f" > "$tmp/ours" 2>/dev/null \
                 && git show ":3:$f" > "$tmp/theirs" 2>/dev/null; then
                verdict=$(python3 scripts/resolve_generated.py \
                            "$tmp/ours" "$tmp/theirs" "$tmp/merged-$(basename "$f")" \
                          2>/dev/null || echo 'none  the resolver failed')
                side=${verdict%% *}
                echo "   $f -> $verdict"
              fi
              case "$side" in
                ours)   git checkout --ours   -- "$f" 2>/dev/null || true ;;
                theirs) git checkout --theirs -- "$f" 2>/dev/null || true ;;
                merged) cp "$tmp/merged-$(basename "$f")" "$f" ;;
                *)      git checkout --theirs -- "$f" 2>/dev/null \
                        || git checkout --ours -- "$f" 2>/dev/null || true ;;
              esac
              git add "$f"
              rm -rf "$tmp"
            done
            GIT_EDITOR=true git rebase --continue >/dev/null 2>&1 || true
            rederive_and_audit
          }

          # What has to happen after ANY pull that replayed this build onto
          # commits it never saw, whether or not a file conflicted: the tree is
          # now two builds' output, chosen file by file, and nothing checked
          # that it agrees with itself.
          rederive_and_audit () {
            # The pull runs with --autostash, and the stash is re-applied as the
            # rebase finishes. It holds what this build wrote and never stages,
            # `scripts/news_insights.json` among it, which the fifteen-minute
            # lane commits too. So the re-apply can leave that file unmerged,
            # and then `git commit --amend` below refuses ("Committing is not
            # possible because you have unmerged files"). Inside
            # `resolve_ours ||` that is not fatal: the plain rebased commit was
            # pushed without the rebuilt crossings or the recomputed
            # fingerprint, as 3cc0ded was at 08:38 on 15 Sep 2026 and four of
            # the six split commits of 10-12 Sep were, and a retry after a lost
            # push could not pull over the unmerged file. Everything this job
            # publishes was staged before the pull, so none of it is in the
            # stash, and main's copy of each such path stands.
            git diff --name-only --diff-filter=U | while read -r f; do
              git checkout HEAD -- "$f" 2>/dev/null || git rm -q --cached -- "$f" 2>/dev/null || true
            done
            # The directory's ratios are COPIED off the review documents, and
            # the race splits the pair without the review document ever
            # conflicting. One this build rewrote identically to the tree it
            # checked out is not in its commit, so the rebase keeps main's
            # copy, while `companies.json` conflicts and the newer build's
            # comes through. The review sheet prices each company at the
            # build's own close, so the other build's copy differs: 142b708
            # went out on 15 Sep 2026 with UNIP at a price-to-book of 2.8315
            # on the row and 2.824 on its sheet, and ab3c580 forty minutes
            # earlier with CSAG at 6.8816 against 6.9048. Every later run then
            # failed its tests on the commit and could not rebuild it.
            #
            # So fold them again over whatever the race left, as the crossings
            # below are rebuilt. A copy over committed documents: no network.
            python3 scripts/apply_company_ratios.py || true
            # The crossings are DERIVED from four documents — the directory,
            # the market file, the news and the filings feed — and the resolver
            # above picks a side for each file on its own. This build stamps
            # its `connections.json` early in an hour-long run, so on a
            # collision the fifteen-minute lane's copy is usually the newer one
            # and is kept, while `companies.json`, which only this job writes,
            # comes through from this build. The session ratios committed are
            # then divided by the PREVIOUS directory's medians: at 22:02 on
            # 10 Sep 2026 AMES went out at 11.04× a median of 553811.5 beside a
            # directory that said 925908.5, which is 6.60×. Six daily builds
            # committed a pair like that between 10 and 12 Sep, and each stood
            # until the next fifteen-minute rebuild.
            #
            # So rebuild the crossings from whatever the resolver left on disk,
            # as publish-live-data does. It is arithmetic over those documents,
            # no network, and it runs before the fingerprint below so the
            # manifest describes the rebuilt file.
            python3 scripts/build_connections_api.py >/dev/null 2>&1 || true
            # The fingerprint has to describe the bytes that actually ended up
            # here, so it is recomputed after any merge and folded in.
            python3 scripts/build_fixtures.py >/dev/null 2>&1 || true
            git add -A public/data app/assets/fixtures ${STORES}
            git diff --cached --quiet || git commit --amend --no-edit >/dev/null
            # And the accuracy audit over the tree about to be pushed, which is
            # not the tree `build_all` audited. It refused to publish a
            # contradiction there and had no say over this one. The fold above
            # should leave it nothing to find; if it finds something anyway,
            # main keeps what it has, the run goes red, and the next build
            # rebuilds from scratch.
            if ! python3 scripts/audit_accuracy.py; then
              echo "::error title=Documents contradict each other::Replayed onto main, this build's documents disagree about a named company (above). Not pushed."
              return 1
            fi
            return 0
          }

          for attempt in 1 2 3; do
            built=$(git rev-parse HEAD)
            if git pull --rebase --autostash origin main; then
              # A clean replay is a mix of two builds as well.
              if [ "$(git rev-parse HEAD)" != "$built" ]; then
                rederive_and_audit || exit 1
              fi
            else
              resolve_ours || exit 1
            fi
            git push origin main && exit 0
            echo "push attempt $attempt lost the race; retrying"
            sleep 5
          done
          echo 'could not push after three attempts'
          exit 1

      # The site serves its data from the Worker's own assets, so a commit here
      # does not reach a reader until something deploys — and nothing did. Every
      # rebuild landed in git and sat there until somebody ran `wrangler deploy`
      # by hand, which is how a fifteen-minute news cadence ended up hours old on
      # screen. Deploying in the run that committed removes the gap and the race
      # with it: the assets uploaded are exactly the commit just pushed.
      #
      # Deploy only validated, successfully published output. A failed deploy
      # must be visible; an absent token still skips this optional path.
      - name: Deploy the site
        if: success() && steps.diff.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7262f969df05178d5542f19912e8f9ba
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo 'no CLOUDFLARE_API_TOKEN secret — the data is committed but not deployed'
            exit 0
          fi
          npx --yes wrangler@4 deploy --config public/wrangler.jsonc

      # Last, and only after the good work is committed and deployed.
      #
      # A run where a source refused is not a clean run, and a green tick on it
      # is how a frozen feed goes unnoticed for eight days — which is exactly
      # what happened to the disclosures document. The data is published; the
      # run is still red; the warning above names the step that did not answer.
      - name: Fail the run if a source did not refresh
        if: always() && steps.rebuild.outputs.code == '1'
        run: |
          echo "::error::A build step could not reach its source. What the other"
          echo "::error::steps produced has been committed and deployed — see the"
          echo "::error::warning on the rebuild step for which one failed."
          exit 1
