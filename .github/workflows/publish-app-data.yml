name: Publish app data

# Keeps the app in step with the website.
#
# The app reads static JSON under public/data/v1/. That JSON is *derived* from
# the same files the website renders — the Cash or Trash criteria document, the
# Opportunity Scanner field note, and the EGX daily scan. Whenever one of those
# changes, this rebuilds the JSON and commits it, which moves the manifest's
# `data_version`, which is what tells every installed app its cache is stale.
#
# Without this the site and the app drift apart silently: the website shows a
# new investigation and the app keeps serving the previous one forever.

on:
  push:
    branches: [main]
    paths:
      - 'public/evidence/cash-or-trash/criteria.md'
      - 'public/egx-insights.html'
      - 'public/cash-or-trash.html'
      - 'public/*-investigation.html'
      - 'scripts/**'
      - '.github/workflows/publish-app-data.yml'

  # The market scan lands on its own cadence, so also run after the EGX session.
  # 16:30 Cairo is an hour after the close; Cairo is UTC+2 in winter, +3 in
  # summer, so both are scheduled and the build is a no-op when nothing changed.
  schedule:
    - cron: '30 13 * * 0-4'
    - cron: '30 14 * * 0-4'

  workflow_dispatch:
    inputs:
      force:
        description: 'Commit even if the output is unchanged'
        type: boolean
        default: false

concurrency:
  group: publish-app-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate before writing anything
        run: python3 scripts/build_all.py --check

      - name: Rebuild published data
        run: python3 scripts/build_all.py

      - name: Show what changed
        id: diff
        run: |
          git add -A public/data app/assets/fixtures
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No change to published data."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat
          fi

      - name: Confirm the manifest fingerprint moved
        if: steps.diff.outputs.changed == 'true'
        run: |
          # If the content changed but data_version did not, installed apps
          # would never drop their cache — the failure this whole workflow
          # exists to prevent. Fail loudly rather than publish a silent no-op.
          changed=$(git diff --cached --name-only)
          if ! grep -q 'public/data/v1/manifest.json' <<<"$changed"; then
            echo "::error::Published data changed but public/data/v1/manifest.json did not."
            echo "::error::That file is what an installed app asks for to find out"
            echo "::error::whether its cache is stale. Without it moving, devices"
            echo "::error::keep serving whatever they downloaded last."
            exit 1
          fi
          if ! grep -q 'app/assets/fixtures/manifest.json' <<<"$changed"; then
            echo "::error::The published manifest moved but the bundled one did not."
            echo "::error::A build shipped now would open on data older than it claims."
            exit 1
          fi
          echo "manifest fingerprint moved with the content, both copies"

      - name: Commit
        if: steps.diff.outputs.changed == 'true' || inputs.force
        run: |
          git config user.name  'barbarian-bot'
          git config user.email 'noreply@thebarbarianproject.com'
          git commit -m 'data: rebuild published app data' \
                     -m 'Generated by .github/workflows/publish-app-data.yml'
          git push
