name: Publish app data

# Keeps the app in step with the website.
#
# The app reads static JSON under public/data/v1/. That JSON is *derived* from
# the same files the website renders — the Cash or Trash criteria document, the
# Opportunity Scanner field note, and the EGX daily scan. Whenever one of those
# changes, this rebuilds the JSON and commits it, which moves the manifest's
# `data_version`, which is what tells every installed app its cache is stale.
#
# Without this the site and the app drift apart silently: the website shows a
# new investigation and the app keeps serving the previous one forever.

on:
  push:
    branches: [main]
    paths:
      - 'public/evidence/cash-or-trash/criteria.md'
      - 'public/egx-insights.html'
      - 'public/cash-or-trash.html'
      - 'public/*-investigation.html'
      - 'scripts/**'
      - '.github/workflows/publish-app-data.yml'

  # Three times a trading day, around the session rather than after it.
  #
  # This used to run once, an hour after the close, on the reasoning that
  # everything it touches changes once a day. That stopped being true: the
  # filings feed, the company snapshots and the crossings all move while the
  # market is open, and a reader looking at the app at noon was reading
  # yesterday afternoon.
  #
  #   09:30 Cairo — before the 10:00 open, so the morning is current
  #   12:30 Cairo — mid-session
  #   14:45 Cairo — just after the 14:30 close
  #
  # **Each time is scheduled twice** because GitHub cron is UTC and Cairo is
  # UTC+2 in winter and UTC+3 in summer. Both fire year-round; the one at the
  # wrong hour is an ordinary run an hour early or late, and the build is a
  # no-op when nothing changed. That is the convention the two crons here used
  # before, kept rather than replaced with a timezone the runner does not have.
  schedule:
    # 09:30 Cairo
    - cron: '30 6 * * 0-4'
    - cron: '30 7 * * 0-4'
    # 12:30 Cairo
    - cron: '30 9 * * 0-4'
    - cron: '30 10 * * 0-4'
    # 14:45 Cairo
    - cron: '45 11 * * 0-4'
    - cron: '45 12 * * 0-4'

  workflow_dispatch:
    inputs:
      force:
        description: 'Commit even if the output is unchanged'
        type: boolean
        default: false

concurrency:
  group: publish-app-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # A browser, so the exchange steps can actually run here.
      #
      # EGX is JS-rendered behind a WAF and refuses plain HTTP, so the filings,
      # the filed net-profit figures and the archive harvest all need a real
      # browser. Without one they skip — cleanly, but forever — and the filings
      # in the app only ever move when somebody runs the build by hand.
      #
      # Best-effort on purpose. If the install fails, or the exchange refuses
      # this runner's address, every step that needs it skips and leaves the
      # last good document in place. That is worth an attempt each run; it is
      # not worth failing a build over.
      - name: Install Scrapling
        id: scrapling
        continue-on-error: true
        run: |
          # The bare package has no fetchers — `scrapling.fetchers` fails to
          # import and every EGX step falls back to skipping. The working local
          # install is scrapling 0.4.11 with patchright and playwright beside
          # it, which is what the `fetchers` extra pulls in.
          python3 -m pip install --quiet "scrapling[fetchers]" \
            || python3 -m pip install --quiet "scrapling[all]" \
            || python3 -m pip install --quiet scrapling patchright playwright
          # Then the browser binaries themselves.
          python3 -m scrapling install || scrapling install \
            || python3 -m patchright install --with-deps chromium || true
          # Only claim a browser once one has actually opened. Exporting the
          # path on faith puts a traceback in the middle of the build log where
          # an honest "skipping" line belongs.
          if python3 -c 'from scrapling.fetchers import StealthyFetcher'; then
            echo "SCRAPLING_PYTHON=$(which python3)" >> "$GITHUB_ENV"
          else
            echo 'scrapling fetchers unavailable — the exchange steps will skip'
          fi

      # The market scan, which is the spine of everything below it.
      #
      # `market.json` and all 282 company documents are built from a
      # TradingView snapshot that has, until now, only ever been produced on
      # one laptop and committed by hand — git history has no CI commit
      # touching `market.json`, ever. So prices, volumes and company profiles
      # moved when somebody remembered, and the "three times a trading day"
      # schedule above was rebuilding everything except the part a reader
      # actually looks at.
      #
      # `egx_scan.mjs` is the research monitor's scanner, cut down to what
      # `build_market_api.py` reads and stripped of its five local file
      # dependencies. Its only dependency is `ws`.
      #
      # Best-effort, and deliberately so: the user's own EGX notes record that
      # TradingView blocks direct POSTs from some addresses, and a GitHub
      # egress IP is a different proposition from a laptop in Cairo. If it is
      # refused, no scan is written, `build_market_api.py` finds no newer file
      # and leaves yesterday's prices exactly where they are — labelled with
      # yesterday's date, which is the honest failure.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch the market scan
        continue-on-error: true
        run: |
          mkdir -p ../work
          npm install ws --no-save --silent
          node scripts/egx_scan.mjs ../work

      # The parsers these tests cover read filed financial figures. A silent
      # regression there publishes a wrong number about a real company rather
      # than crashing, so they run before anything is written.
      - name: Test the parsers
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Validate before writing anything
        run: python3 scripts/build_all.py --check

      - name: Rebuild published data
        run: python3 scripts/build_all.py

      - name: Show what changed
        id: diff
        run: |
          git add -A public/data app/assets/fixtures
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No change to published data."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat
          fi

      - name: Confirm the manifest fingerprint moved
        if: steps.diff.outputs.changed == 'true'
        run: |
          # If the content changed but data_version did not, installed apps
          # would never drop their cache — the failure this whole workflow
          # exists to prevent. Fail loudly rather than publish a silent no-op.
          # The manifest is byte-stable when the fingerprint has not moved
          # (build_fixtures.py keeps the previous generated_at), so its presence
          # in the diff is real evidence that data_version changed rather than
          # just evidence that the clock did.
          before=$(git show HEAD:public/data/v1/manifest.json 2>/dev/null \
                   | python3 -c 'import json,sys; print(json.load(sys.stdin)["data_version"])' 2>/dev/null || echo none)
          after=$(python3 -c 'import json; print(json.load(open("public/data/v1/manifest.json"))["data_version"])')
          echo "data_version: $before -> $after"
          if [ "$before" = "$after" ]; then
            echo "::error::Published data changed but data_version did not move."
            echo "::error::Installed apps compare that string to decide whether"
            echo "::error::their cache is stale, so every device would keep"
            echo "::error::serving what it already had. Check that the changed"
            echo "::error::files are covered by RESOURCES or UNVERSIONED in"
            echo "::error::scripts/build_fixtures.py."
            exit 1
          fi

          changed=$(git diff --cached --name-only)
          if ! grep -q 'public/data/v1/manifest.json' <<<"$changed"; then
            echo "::error::Published data changed but public/data/v1/manifest.json did not."
            echo "::error::That file is what an installed app asks for to find out"
            echo "::error::whether its cache is stale. Without it moving, devices"
            echo "::error::keep serving whatever they downloaded last."
            exit 1
          fi
          if ! grep -q 'app/assets/fixtures/manifest.json' <<<"$changed"; then
            echo "::error::The published manifest moved but the bundled one did not."
            echo "::error::A build shipped now would open on data older than it claims."
            exit 1
          fi
          echo "manifest fingerprint moved with the content, both copies"

      - name: Commit
        if: steps.diff.outputs.changed == 'true' || inputs.force
        run: |
          git config user.name  'barbarian-bot'
          git config user.email 'noreply@thebarbarianproject.com'
          git commit -m 'data: rebuild published app data' \
                     -m 'Generated by .github/workflows/publish-app-data.yml'
          # This races the 15-minute job, six times a trading day.
          # These outputs are generated, and this job just generated them from
          # the current sources — so on a collision with the fifteen-minute
          # job, ours is the newer answer and wins. A conflict anywhere else
          # is not something to resolve automatically, so it stops.
          #
          # The previous version pulled, hit a conflict, left the rebase in
          # progress, and then failed every retry with "unmerged files" — a
          # loop that could only ever fail three times.
          resolve_ours () {
            local unmerged
            unmerged=$(git diff --name-only --diff-filter=U)
            [ -z "$unmerged" ] && return 0
            if echo "$unmerged" | grep -qv -e '^public/data/' -e '^app/assets/fixtures/'; then
              echo "conflict outside generated data:"; echo "$unmerged"
              git rebase --abort || true
              return 1
            fi
            # During a rebase "theirs" is the commit being replayed, which is
            # this build's output.
            echo "$unmerged" | while read -r f; do
              git checkout --theirs -- "$f" 2>/dev/null || git checkout --ours -- "$f" 2>/dev/null || true
              git add "$f"
            done
            GIT_EDITOR=true git rebase --continue >/dev/null 2>&1 || true
            # The fingerprint has to describe the bytes that actually ended up
            # here, so it is recomputed after any merge and folded in.
            python3 scripts/build_fixtures.py >/dev/null 2>&1 || true
            git add -A public/data app/assets/fixtures
            git diff --cached --quiet || git commit --amend --no-edit >/dev/null
            return 0
          }

          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main; then
              git push origin main && exit 0
            else
              resolve_ours || exit 1
              git push origin main && exit 0
            fi
            echo "push attempt $attempt lost the race; retrying"
            sleep 5
          done
          echo 'could not push after three attempts'
          exit 1
