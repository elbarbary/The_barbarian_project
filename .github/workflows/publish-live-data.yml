name: Publish live data

# News, rates and the crossings, every 15 minutes.
#
# `publish-app-data.yml` runs three times a trading day — before the open, mid
# session, and just after the close — because the market scan, the filings and
# the scored studies move on that cadence. News does not: Al Borsa publishes
# through the afternoon, and on the old once-a-day cron a headline filed at
# 11:00 did not appear until 16:30. Gold was worse in a different way — the
# metals feed updates intraday and we were pinning a morning price for
# twenty-four hours while calling it today's.
#
# These scripts have no dependency on the daily scan and cost a handful of HTTP
# calls between them, so they get their own schedule. `build_connections_api`
# rides along making no calls at all: it is arithmetic over documents already
# on disk, and without it a headline landing at ten could not cross with a
# filing until the afternoon.
#
# One coupling to know about: the news triage reads each company's published
# session to decide whether a headline is worth a second look. Between the
# close and the next daily build that session is yesterday's, which is correct
# — yesterday's close IS the last completed session — and the document says so
# through the per-item evidence date rather than implying otherwise.

on:
  schedule:
    # Every 15 minutes. GitHub's scheduler is best-effort and drifts under
    # load, so this is a floor rather than a guarantee; the app never assumes
    # an age it has not been told.
    - cron: '*/15 * * * *'

  push:
    branches: [main]
    paths:
      - 'scripts/build_news_api.py'
      - 'scripts/build_rates_api.py'
      - '.github/workflows/publish-live-data.yml'

  workflow_dispatch:

concurrency:
  # Never two of these at once: they both commit to main, and a 15-minute cron
  # that overlaps itself produces a push race rather than fresher data.
  group: publish-live-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch headlines and rates
        # No script writes anything when its sources are unreachable, so a bad
        # upstream leaves the last good document in place rather than
        # publishing an empty one. `|| true` keeps one dead source from
        # blocking another's update.
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 scripts/build_news_api.py || true
          python3 scripts/build_rates_api.py || true
          # Pure local arithmetic over the feeds above and the filings the
          # daily job left behind — no network, so it costs nothing to keep
          # current. Without it a headline that lands at ten in the morning
          # cannot cross with a filing until the next daily run.
          python3 scripts/build_connections_api.py || true
          # Disclosures. The note that used to sit at the foot of this file
          # said these could not run here because they need Scrapling driving
          # a real Chromium — EGX serves a 7 KB stub to anything that is not a
          # browser. That stopped being true when `fetch_beta` was added: the
          # exchange's own JSON API answers the whole date window in one
          # request, no browser, and it is what the script reaches for first.
          #
          # Nothing ran this on a schedule in the meantime. Not this workflow,
          # which excluded it; not the daily one; not `harvest_local.sh`, which
          # only ever harvested filings. So it ran when somebody remembered,
          # and on 3 Sep 2026 the published feed's newest filing was 26 Aug —
          # eight days stale on the live site, with no counter to say so.
          #
          # The browser scrape is still the fallback and still cannot run here.
          # That is fine and deliberate: with no Scrapling installed the script
          # prints why and exits 0, leaving the last good document in place.
          python3 scripts/build_disclosures_api.py || true

      - name: Refresh the manifest
        # The manifest's per-resource version is what tells an installed app
        # its cache is stale. Without this the new JSON sits on the CDN and
        # every phone keeps serving what it already had.
        run: python3 scripts/build_fixtures.py

      - name: Commit if anything moved
        id: commit
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/data/v1/news public/data/v1/rates \
                  public/data/v1/disclosures \
                  public/data/v1/connections.json \
                  public/data/v1/manifest.json \
                  app/assets/fixtures/news app/assets/fixtures/rates \
                  app/assets/fixtures/disclosures \
                  app/assets/fixtures/connections.json \
                  app/assets/fixtures/manifest.json
          if git diff --cached --quiet; then
            echo 'nothing moved'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          git commit -m 'data: live news and rates'
          # A 15-minute job racing the daily build will lose a push now and
          # then. Rebasing and retrying is cheaper than failing the run, and
          # these files are generated — whatever landed first is regenerated
          # from the same sources on the next tick anyway.
          # These outputs are generated, and this job just generated them from
          # the current sources — so on a collision with the fifteen-minute
          # job, ours is the newer answer and wins. A conflict anywhere else
          # is not something to resolve automatically, so it stops.
          #
          # The previous version pulled, hit a conflict, left the rebase in
          # progress, and then failed every retry with "unmerged files" — a
          # loop that could only ever fail three times.
          resolve_ours () {
            local unmerged
            unmerged=$(git diff --name-only --diff-filter=U)
            [ -z "$unmerged" ] && return 0
            if echo "$unmerged" | grep -qv -e '^public/data/' -e '^app/assets/fixtures/'; then
              echo "conflict outside generated data:"; echo "$unmerged"
              git rebase --abort || true
              return 1
            fi
            # During a rebase "theirs" is the commit being replayed, which is
            # this build's output.
            echo "$unmerged" | while read -r f; do
              git checkout --theirs -- "$f" 2>/dev/null || git checkout --ours -- "$f" 2>/dev/null || true
              git add "$f"
            done
            GIT_EDITOR=true git rebase --continue >/dev/null 2>&1 || true
            # The fingerprint has to describe the bytes that actually ended up
            # here, so it is recomputed after any merge and folded in.
            python3 scripts/build_fixtures.py >/dev/null 2>&1 || true
            git add -A public/data app/assets/fixtures
            git diff --cached --quiet || git commit --amend --no-edit >/dev/null
            return 0
          }

          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main; then
              git push origin main && exit 0
            else
              resolve_ours || exit 1
              git push origin main && exit 0
            fi
            echo "push attempt $attempt lost the race; retrying"
            sleep 5
          done
          echo 'could not push after three attempts'
          exit 1
          exit 1

# NOTE — disclosures now run in this workflow, above.
#
# They were excluded because `build_disclosures_api.py` needed Scrapling
# driving a real Chromium: EGX serves a 7 KB stub to anything that is not a
# browser, and that is a heavier dependency than a fifteen-minute job should
# carry. `fetch_beta` removed the requirement — the exchange's own JSON API
# returns the whole window in one request — but nothing moved the step, so for
# a while no schedule built them at all.

      # The site serves its data from the Worker's own assets, so a commit here
      # does not reach a reader until something deploys — and nothing did. Every
      # rebuild landed in git and sat there until somebody ran `wrangler deploy`
      # by hand, which is how a fifteen-minute news cadence ended up hours old on
      # screen. Deploying in the run that committed removes the gap and the race
      # with it: the assets uploaded are exactly the commit just pushed.
      #
      # Best-effort on purpose. A failed deploy must not fail a build whose data
      # is already committed and correct; the next run carries it. And with no
      # token configured it says so and does nothing, so the workflow keeps
      # working on a fork or before the secret exists.
      - name: Deploy the site
        if: always() && steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7262f969df05178d5542f19912e8f9ba
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo 'no CLOUDFLARE_API_TOKEN secret — the data is committed but not deployed'
            exit 0
          fi
          npx --yes wrangler@4 deploy --config public/wrangler.jsonc
