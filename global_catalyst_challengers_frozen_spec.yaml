  prospective_shock_sentinel:
    identifier: SHOCK_SENTINEL_PROSPECTIVE
    role: Prospective High-Frequency Geopolitical / Maritime Shock Monitor
    governance_status: RESEARCH_ONLY_NOT_OFFICIAL
    historical_optimization: NONE (Strictly Zero Backtest Tuning)
    evidence_tier: PROSPECTIVE_REAL_TIME_ARCHIVE
    data_streams:
    - stream_name: Suez Canal & Bab el-Mandeb AIS Transits
      provider: IMF PortWatch / UN Global Platform AIS
      trigger_condition: 7-day rolling vessel transit volume drop >= 30.0%
    - stream_name: Red Sea Maritime & Naval Attacks
      provider: UK Maritime Trade Operations (UKMTO)
      trigger_condition: Naval / kinetic incident count >= 2 in rolling 7 days
    - stream_name: High-Frequency News Velocity & Negative Tone
      provider: GDELT 2.0 Global Knowledge Graph (15-min feeds)
      trigger_condition: Egypt negative tone z-score >= 2.50 standard deviations
    - stream_name: Domestic Civil Unrest Acceleration
      provider: ACLED (Real-Time Weekly Ingest)
      trigger_condition: Protest / unrest event velocity >= 2.00 standard deviations
    - stream_name: Critical Infrastructure & Telecommunications Outage
      provider: Cloudflare Radar API
      trigger_condition: Egypt nationwide BGP / netflow connectivity drop >= 25.0%
    state_machine_logic:
      states:
      - NORMAL
      - SHOCK_ADVISORY
      - SEVERE_SHOCK_WARNING
      transitions:
        NORMAL_TO_ADVISORY: Exactly 1 shock trigger active
        NORMAL_TO_SEVERE: '>= 2 concurrent shock triggers active OR single catastrophic
          trigger (e.g. Suez drop >= 50%)'
        EXIT_TO_NORMAL: Zero triggers active for 3 consecutive days
    research_mandate: Build an uncompromised live prospective dataset from September
      13 onward to test whether real-time external intelligence catches sudden exogenous
      shocks without historical backtest ambiguity.
